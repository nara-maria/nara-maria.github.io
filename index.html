dling enquiries and prospective-client conversations through DMs, and contributing to website creation and development.","links":[["Faustas Media · Instagram","https://www.instagram.com/faustas_media/"],["Website","https://beniskillen-faustas-media.benkillen.workers.dev/"]],"n":"03"},{"name":"Spectre Studios","field":"Creative studio / Social launch & web","text":"I supported the studio’s social media launch and manage its social presence, developing content and editing creative-team footage for social channels. I also worked on website creation and development, helping bring the new studio’s work and services online. My contribution combines social content, publishing and digital development in collaboration with the studio’s creative team.","links":[["Spectre Studios · Instagram","https://www.instagram.com/_spectrestudios/"],["Website preview","https://spectre-nextjs.vercel.app/en"]],"note":"The website link is a preview. My role covers social and digital work in collaboration with the studio; original creative production is credited to its creators.","n":"04"},{"name":"Red Dust · social media","field":"Purpose-led / Content, campaigns & community","text":"I managed Red Dust’s social media throughout my time with the organisation, from content and campaign creation to publishing, performance review and promoting its work. Working alongside First Nations staff and community teams, I developed media guidance and consent processes to support culturally respectful storytelling. Facebook was our largest social community and a particular focus: I created and edited high-performing video content, reviewed what resonated and produced videos that generated platform monetisation revenue. I also managed YouTube and developed content for its audience.","links":[["Red Dust · Facebook","https://www.facebook.com/reddustoz/"],["YouTube","https://www.youtube.com/@reddustoz"],["Community stories","https://www.reddust.org.au/latest-news"],["2025 Annual Review","https://www.reddust.org.au/hubfs/Reports/RD-067%20Red%20Dust%202025%20Annual%20Review%20WEB.pdf"]],"note":"Prior employment at Red Dust. Community stories were developed with cultural guidance and consent; my contribution was the media and communications work. The selected films and annual reviews below show examples.","n":"05"},{"name":"Fortem Media · agency socials","field":"Agency / Content, community & reporting","text":"I managed Fortem Media’s own social channels throughout my employment with the agency. I edited videos and adapted projects produced by the creative team for social, and created in-house staff, team and culture content. I also managed new-client enquiries through DMs, reported on social performance and supported website management and content updates.","links":[["Fortem Media · Instagram","https://www.instagram.com/fortemmedia/"],["Facebook","https://www.facebook.com/fortemmedia"],["Website & project archive","https://www.fortemmedia.com/archives"]],"note":"This describes my work during my employment at Fortem, not current account management. Agency projects and original creative production remain credited to the team.","n":"06"},{"n":"07","name":"Table Manners","field":"Hospitality / Restaurant launch","text":"Supported the unconventional, social-first launch of Table Manners in Bronte, Sydney: launch PR, social content, brand imagery, photography, filming and editing. Good Food specifically featured the quirky pre-launch campaign and Fortem’s creative approach.","href":"https://www.smh.com.au/goodfood/sydney-eating-out/beachside-spot-with-fine-dining-cred-opens-with-moreton-bay-bug-sandwich-on-the-menu-20240806-p5jzxs.html","link":"Read the launch coverage"},{"n":"08","name":"NOMAD Group · social media","field":"Hospitality / Multi-venue content","text":"More than six months of social content across NOMAD Group’s restaurants, including shoot planning, content production and monthly retainer delivery. Venue accounts from that period included NOMAD Sydney, NOMAD Melbourne, Reine & La Rue and Beau Sydney.","links":[["NOMAD Sydney · Instagram","https://www.instagram.com/nomad.sydney/"],["NOMAD Melbourne · Instagram","https://www.instagram.com/nomad.melbourne/"],["Reine & La Rue · Instagram","https://www.instagram.com/reine.larue/"],["Beau Sydney · historical account","https://www.instagram.com/beau.syd/"]],"note":"Beau Sydney has since closed. These are venue accounts associated with my Fortem work period, not a claim of current account management."},{"n":"09","name":"Goodfields Eatery","field":"Hospitality / Photography, reels & social brand","text":"Managed Goodfields’ social media throughout my Fortem role and helped establish its social brand identity, visual direction and consistent content style. Produced a substantial library of food and venue photography, filmed and edited reels—including viral clips—and delivered monthly shoots and performance reporting. Built reusable photo and video assets for ongoing brand use, alongside PR coordination and support.","links":[["Goodfields · Instagram","https://www.instagram.com/goodfieldseatery/"],["Facebook","https://www.facebook.com/goodfieldseatery/"],["Website","https://goodfields.com.au/"],["Broadsheet · venue coverage","https://www.broadsheet.com.au/sydney/food-and-drink/article/now-open-goodfields-eatery-serving-all-day-breakfast-menu-where-lobster-option"]],"note":"Broadsheet’s venue feature was published in 2018, before my Fortem role. It is included as restaurant context, not a PR placement claimed as my work."},{"n":"10","name":"Hyro","field":"E-commerce / Brand launch","text":"Supported the electrolyte brand’s e-commerce launch through TikTok, social content and account management, branding, tone of voice and performance review.","links":[["Hyro · website","https://drinkhyro.com/"],["Instagram","https://www.instagram.com/drinkhyro/"],["TikTok","https://www.tiktok.com/@drinkhyro"]]},{"n":"11","name":"Unofficial Run Club","field":"Community / Launch content","text":"Support
